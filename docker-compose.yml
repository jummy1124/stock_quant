services:
  # 單一進程: 每分鐘篩選一次，同一份結果同時供 Excel/LINE 與內嵌 HTTP API
  # (--serve)。tick 只跑一次 -> 不會重複爬即時價。前端輪詢 GET /api/screen。
  stock-quant:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-quant:latest
    container_name: stock-quant
    # 容器內時間判斷用台北時區 (Dockerfile 已設 TZ，這裡再次明示)
    environment:
      TZ: Asia/Taipei
      # 前端在別的網域時，把這裡換成前端網址 (逗號分隔多個)；預設 * 方便開發
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    # LINE 推播等密鑰從 .env 載入 (複製 .env.example;此檔不進 git)
    env_file:
      - .env
    ports:
      - "8000:8000"            # 內嵌 API
    volumes:
      # 歷史日K 快取持久化 (named volume，避免每次啟動重抓全市場)
      - stock-cache:/app/.cache
      # Excel 輸出落到主機 ./data，方便在主機端開啟 ranking.xlsx
      - ./data:/app/data
    # 預設常駐每分鐘篩選 + 內嵌 API；Excel 寫到 /app/data。
    # 要每日 13:00 LINE 推播加上: "--notify","line"
    command: ["--excel", "/app/data/ranking.xlsx", "--serve", "--api-port", "8000"]
    restart: unless-stopped

volumes:
  stock-cache:
